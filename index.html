<!DOCTYPE html>
<html lang="zh-CN" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Style Atlas — 203 UI styles · StyleKit × UI/UX Pro Max</title>
  <meta name="description" content="A merged catalog of 203 UI design styles: design tokens, AI prompts, DESIGN.md, component previews, pointer interactions and FAQs. 12 languages, light and dark.">
  <meta name="theme-color" content="#f6f8f7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        var mode = q.get('theme') || localStorage.getItem('atlas:theme') || 'auto';
        var dark = mode === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : mode === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>
</head>
<body>
  <header id="siteHeader"></header>

  <main>
    <section class="hero">
      <div class="wrap">
        <span class="hero-kicker"><i class="dot"></i><span data-i18n="heroKicker"></span></span>
        <h1><span data-i18n="heroTitle1"></span></h1>
        <p class="hero-lead" data-i18n="heroLead"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#library">
            <span data-i18n="ctaBrowse"></span>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10M4 9l4 4 4-4"/></svg>
          </a>
          <a class="btn btn-ghost" href="https://github.com/PIKACHUIM/uitest" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
            <span data-i18n="ctaGithub"></span>
          </a>
        </div>

        <div class="stats reveal">
          <div class="stat"><b data-stat="styles">203</b><span data-i18n="statStyles"></span></div>
          <div class="stat"><b data-stat="categories">8</b><span data-i18n="statCategories"></span></div>
          <div class="stat"><b data-stat="languages">12</b><span data-i18n="statLanguages"></span></div>
          <div class="stat"><b data-stat="sources">3</b><span data-i18n="statSources"></span></div>
        </div>
      </div>
    </section>

    <section class="library" id="library">
      <div class="wrap">
        <div class="toolbar">
          <div class="toolbar-row">
            <div class="search">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m13.5 13.5 3.5 3.5"/></svg>
              <input id="searchInput" type="search" autocomplete="off" placeholder="Search styles, colours, use cases…" aria-label="Search styles" data-i18n-attr="placeholder:searchPlaceholder,aria-label:searchPlaceholder">
            </div>
            <select class="select" id="sourceSelect" aria-label="Source" data-i18n-attr="aria-label:sourceLabel"></select>
            <select class="select" id="sortSelect" aria-label="Sort" data-i18n-attr="aria-label:sortLabel"></select>
            <span class="result-bar" id="resultCount" aria-live="polite"></span>
          </div>
          <div class="toolbar-row" style="margin-top:8px">
            <div class="chips" id="catChips" role="group" aria-label="Categories"></div>
          </div>
        </div>

        <div class="grid" id="grid" style="margin-top:18px"></div>

        <div class="empty" id="empty" hidden>
          <h3 data-i18n="emptyTitle"></h3>
          <p data-i18n="emptyDesc" style="margin-bottom:16px"></p>
          <button class="btn btn-ghost btn-sm" id="emptyReset" type="button" data-i18n="emptyReset"></button>
        </div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="assets/i18n.js"></script>
  <script src="assets/data/catalog.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
