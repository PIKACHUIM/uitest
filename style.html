<!DOCTYPE html>
<html lang="zh-CN" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style — UI Style Atlas</title>
  <meta name="description" content="Design tokens, AI prompt and DESIGN.md, component preview, pointer interactions and FAQ for every UI style in the atlas.">
  <meta name="theme-color" content="#f6f8f7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        var mode = q.get('theme') || localStorage.getItem('atlas:theme') || 'auto';
        var dark = mode === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : mode === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>
</head>
<body>
  <header id="siteHeader"></header>
  <main id="detailRoot"></main>
  <footer id="siteFooter"></footer>

  <script src="assets/i18n.js"></script>
  <script src="assets/data/catalog.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/style-page.js"></script>
</body>
</html>
